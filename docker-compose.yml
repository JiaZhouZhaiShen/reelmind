# =============================================================================
# ReelMind — Docker Compose（生产 / Synology NAS）
# =============================================================================
#
# 🔴🔴🔴 安全警告 ｜ SECURITY WARNING 🔴🔴🔴
# 部署到任何可网络访问的环境前，必须在 .env 中设置强密码覆盖默认值！
# 尤其是: DB_PASSWORD, JWT_SECRET
# 🔴🔴🔴 安全警告 ｜ SECURITY WARNING 🔴🔴🔴
#
# 快速开始（无需本地构建，前端已烘入镜像）:
#   1. cp .env.example .env
#   2. docker compose pull && docker compose up -d
#
# 镜像版本: 由 REELMIND_VERSION 控制（默认 latest 跟踪 main；
#           建议锁定 release tag，如 REELMIND_VERSION=v9.26.1010）
#
# GPU 机器启用 AI 推理: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# 本地开发（源码挂载 + 本地构建）: 见 docker-compose.dev.yml
# =============================================================================
name: reelmind
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL 16 + pgvector — 视频元数据 + CLIP 向量
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reelmind-postgres
    logging: *default-logging
    restart: always
    shm_size: 256mb
    environment:
      # 🔴 开发默认密码，生产环境务必在 .env 中覆盖！
      POSTGRES_USER: ${DB_USER:-reelmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reelmind}
      POSTGRES_DB: ${DB_NAME:-reelmind}
      POSTGRES_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE:-768MB}
      POSTGRES_WORK_MEM: ${PG_WORK_MEM:-16MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${PG_MAINT_WORK_MEM:-64MB}
    volumes:
      - ${PGDATA_ROOT:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reelmind}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-1g}
        reservations:
          memory: ${PG_MEM_RESERVE:-256M}

  # Redis 7 — 通用缓存/队列
  redis:
    image: redis:7-alpine
    container_name: reelmind-redis
    logging: *default-logging
    restart: always
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT_MAP:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
        reservations:
          memory: ${REDIS_MEM_RESERVE:-64M}

  # ReelMind API Server (FastAPI) — 前端 dist 已烘入镜像 /web/dist
  reelmind-server:
    image: ghcr.io/jiazhouzhaishen/reelmind-server:${REELMIND_VERSION:-latest}
    container_name: reelmind-server
    logging: *default-logging
    restart: always
    ports: []
    environment:
      # 🔴 安全警告: 以下为开发默认值，生产环境务必在 .env 中设置强随机 JWT_SECRET！
      JWT_SECRET: ${JWT_SECRET:-reelmind-dev-secret-change-me-in-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-reelmind}          # 🔴 默认值，生产环境务必覆盖
      DB_PASSWORD: ${DB_PASSWORD:-reelmind}  # 🔴 默认值，生产环境务必覆盖
      DB_NAME: ${DB_NAME:-reelmind}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      DATA_ROOT: /data/reelmind/data
      CACHE_ROOT: /data/reelmind/cache
      MODEL_ROOT: /data/reelmind/models
      ULTRALYTICS_CACHE_DIR: /data/reelmind/models/ultralytics
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: ${PORT:-2588}
      PROXY_VIDEO_BITRATE: ${PROXY_VIDEO_BITRATE:-1M}
      PROXY_VIDEO_MAX_WIDTH: ${PROXY_VIDEO_MAX_WIDTH:-960}
      THUMBNAIL_QUALITY: ${THUMBNAIL_QUALITY:-80}
      AI_SERVICE_URL: http://reelmind-ai:2589
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      TZ: Asia/Shanghai
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    volumes:
      - ${REELMIND_DATA_ROOT:-./data/reelmind}:/data/reelmind
      - ${EXTERNAL_MEDIA_DIR:-./media}:/media:ro
      - nas-media:/nas-media:rw
      # 管理页「.env 编辑」功能读取此挂载；不需要该功能可删除此行
      - ./.env:/reelmind.env:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-2588}/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-2g}
          cpus: ${SERVER_CPU_LIMIT:-2.0}
        reservations:
          memory: ${SERVER_MEM_RESERVE:-2g}

  # ReelMind Orchestrator — lightweight job scheduler (CPU-only)
  reelmind-orchestrator:
    image: ghcr.io/jiazhouzhaishen/reelmind-orchestrator:${REELMIND_VERSION:-latest}
    container_name: reelmind-orchestrator
    logging: *default-logging
    restart: always
    environment:
      ORCHESTRATOR_POLL_INTERVAL: ${ORCHESTRATOR_POLL_INTERVAL:-5}
      ORCHESTRATOR_JOB_TIMEOUT: ${ORCHESTRATOR_JOB_TIMEOUT:-180}
      ORCHESTRATOR_MAX_RETRIES: ${ORCHESTRATOR_MAX_RETRIES:-3}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${REELMIND_DATA_ROOT:-./data/reelmind}:/data/reelmind
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${ORCHESTRATOR_MEM_LIMIT:-128m}
          cpus: ${ORCHESTRATOR_CPU_LIMIT:-0.5}
        reservations:
          memory: ${ORCHESTRATOR_MEM_RESERVE:-32M}

  # ReelMind AI Service — AI 推理（无 GPU 机器也可启动，AI 功能可关）
  # GPU 机器请叠加 docker-compose.gpu.yml 启用 NVIDIA runtime
  reelmind-ai:
    image: ghcr.io/jiazhouzhaishen/reelmind-ai:${REELMIND_VERSION:-latest}
    container_name: reelmind-ai
    logging: *default-logging
    restart: always
    ports:
      - "2589:2589"
    environment:
      # 🔴 开发默认密码，生产环境务必在 .env 中覆盖！
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-reelmind}
      DB_PASSWORD: ${DB_PASSWORD:-reelmind}
      DB_NAME: ${DB_NAME:-reelmind}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      DATA_ROOT: /data/reelmind/data
      CACHE_ROOT: /data/reelmind/cache
      MODEL_ROOT: /data/reelmind/models
      ULTRALYTICS_CACHE_DIR: /data/reelmind/models/ultralytics
      ENABLE_WHISPER: ${ENABLE_WHISPER:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      ENABLE_CLIP: ${ENABLE_CLIP:-false}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_HOME: /data/reelmind/models/huggingface
      HF_HUB_CACHE: /data/reelmind/models/hub
      TORCH_HOME: /data/reelmind/models/torch
      PADDLE_HOME: /data/reelmind/models/paddle
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      TZ: Asia/Shanghai
      FFPROBE_CONCURRENCY: ${FFPROBE_CONCURRENCY:-8}
      DEBUG: ${DEBUG:-false}
      PROXY_VIDEO_BITRATE: ${PROXY_VIDEO_BITRATE:-1M}
      PROXY_VIDEO_MAX_WIDTH: ${PROXY_VIDEO_MAX_WIDTH:-960}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
    volumes:
      - ${REELMIND_DATA_ROOT:-./data/reelmind}:/data/reelmind
      - ${EXTERNAL_MEDIA_DIR:-./media}:/media:ro
      - nas-media:/nas-media:rw
    command: ["/app/docker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2589/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${AI_MEM_LIMIT:-14g}
          cpus: ${AI_CPU_LIMIT:-16.0}
        reservations:
          memory: ${AI_MEM_RESERVE:-4g}

  # nginx 反向代理（大文件零拷贝视频流）— 前端静态资源已烘入镜像
  nginx:
    image: ghcr.io/jiazhouzhaishen/reelmind-nginx:${REELMIND_VERSION:-latest}
    container_name: reelmind-nginx
    logging: *default-logging
    restart: always
    ports:
      - "${PORT_MAP:-0.0.0.0:2588}:2588"
    volumes:
      - ${EXTERNAL_MEDIA_DIR:-./media}:/media:ro
      - nas-media:/nas-media:ro
      - ${REELMIND_DATA_ROOT:-./data/reelmind}:/data/reelmind:ro
    depends_on:
      - reelmind-server
    networks:
      - reelmind-net
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEM_LIMIT:-256m}
        reservations:
          memory: ${NGINX_MEM_RESERVE:-64M}

networks:
  reelmind-net:
    name: reelmind-network
    driver: bridge

# nas-media 为 compose 自动创建的具名卷（不再要求 external）。
# 如需指向 NAS 上的已有媒体目录，改用 EXTERNAL_MEDIA_DIR 挂载。
volumes:
  nas-media:
