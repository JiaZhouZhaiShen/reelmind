name: Publish GHCR images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag1=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag2=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag1=latest" >> "$GITHUB_OUTPUT"
            echo "tag2=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.slim
          push: true
          tags: |
            ghcr.io/jiazhouzhaishen/reelmind-server:${{ steps.meta.outputs.tag1 }}
            ghcr.io/jiazhouzhaishen/reelmind-server:${{ steps.meta.outputs.tag2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/jiazhouzhaishen/reelmind-orchestrator:${{ steps.meta.outputs.tag1 }}
            ghcr.io/jiazhouzhaishen/reelmind-orchestrator:${{ steps.meta.outputs.tag2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ai
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/ai_service/Dockerfile
          push: true
          tags: |
            ghcr.io/jiazhouzhaishen/reelmind-ai:${{ steps.meta.outputs.tag1 }}
            ghcr.io/jiazhouzhaishen/reelmind-ai:${{ steps.meta.outputs.tag2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/jiazhouzhaishen/reelmind-nginx:${{ steps.meta.outputs.tag1 }}
            ghcr.io/jiazhouzhaishen/reelmind-nginx:${{ steps.meta.outputs.tag2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
