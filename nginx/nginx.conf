worker_processes auto;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    use epoll;
    worker_connections 65535;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 2588;
        server_name _;
        root /web/dist;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理（非视频请求）
        location /api/ {
            proxy_pass http://reelmind-server:2588;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # X-Accel internal locations
        location /accel/nas-media/ {
            internal;
            alias /nas-media/;
            directio 4M;
            aio threads;
            output_buffers 2 1m;
            sendfile on;
            tcp_nopush on;
            open_file_cache max=1000 inactive=120s;
            open_file_cache_valid 60s;
        }

        location /accel/media/ {
            internal;
            alias /media/;
            directio 4M;
            aio threads;
            output_buffers 2 1m;
            sendfile on;
            tcp_nopush on;
            open_file_cache max=1000 inactive=120s;
            open_file_cache_valid 60s;
        }

        location /accel/cache/ {
            internal;
            alias /data/reelmind/cache/;
            directio 4M;
            aio threads;
            output_buffers 2 1m;
            sendfile on;
            tcp_nopush on;
            expires 7d;
        }

        location /accel/data/ {
            internal;
            alias /data/reelmind/;
            directio 4M;
            aio threads;
            output_buffers 2 1m;
            sendfile on;
            tcp_nopush on;
        }
    }
}
