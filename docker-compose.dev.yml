# =============================================================================
# ReelMind — 本地开发覆盖文件（源码挂载 + 本地构建）
# =============================================================================
# 开发者日常迭代用：源码热挂载、镜像本地构建，前端手动构建：
#
#   cd web && npm install && npm run build   # 前端改动后需重新 build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 普通部署不要用本文件——直接 `docker compose pull && docker compose up -d`。
# =============================================================================
services:
  reelmind-server:
    build:
      context: .
      dockerfile: server/Dockerfile.slim
    image: reelmind/server-slim:dev
    volumes:
      - ./server:/app
      - ./web/dist:/web/dist:ro

  reelmind-orchestrator:
    build:
      context: .
      dockerfile: server/orchestrator/Dockerfile
    image: reelmind/orchestrator:dev
    volumes:
      - ./server/orchestrator:/app

  reelmind-ai:
    build:
      context: .
      dockerfile: server/ai_service/Dockerfile
    image: reelmind/ai:dev
    volumes:
      - ./server/ai_service:/app
      - ./server:/server

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: reelmind/nginx:dev
